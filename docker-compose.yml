version: '3.8'

services:
  # --- FRONTEND (NEXT.JS APP ROUTER) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fittrack-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  # --- BACKEND API (LARAVEL 11) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fittrack-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
      - minio

  # --- LARAVEL QUEUE WORKER ---
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fittrack-queue-worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=pose_processing,default", "--tries=2", "--timeout=180"]
    env_file:
      - ./backend/.env
    depends_on:
      - backend
      - redis
      - pose-worker

  # --- PYTHON POSE WORKER (FASTAPI + MEDIAPIPE) ---
  pose-worker:
    build:
      context: ./pose-worker
      dockerfile: Dockerfile
    container_name: fittrack-pose-worker
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - POSE_VIDEO_MAX_SIZE_MB=100
      - POSE_VIDEO_MAX_DURATION_SEC=60

  # --- DATABASE (POSTGRESQL 16) ---
  postgres:
    image: postgres:16-alpine
    container_name: fittrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fittrack
      POSTGRES_USER: fittrack_user
      POSTGRES_PASSWORD: fittrack_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- CACHE & QUEUE BROKER (REDIS 7.2) ---
  redis:
    image: redis:7.2-alpine
    container_name: fittrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # --- S3-COMPATIBLE OBJECT STORAGE (MINIO) ---
  minio:
    image: quay.io/minio/minio:latest
    container_name: fittrack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
