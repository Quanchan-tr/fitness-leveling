version: '3.8'

services:
  # --- FRONTEND (NEXT.JS APP ROUTER) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fittrack-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  # --- BACKEND API (LARAVEL 11) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fittrack-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Shared private storage: accessible by backend, queue-worker, and pose-worker
      - private_storage:/var/www/html/storage/app/private
    depends_on:
      - postgres

  # --- LARAVEL QUEUE WORKER ---
  # Runs php artisan queue:work with the database driver (PostgreSQL jobs table).
  # No Redis required: queue state lives entirely in PostgreSQL.
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fittrack-queue-worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "database", "--queue=pose_processing,default", "--tries=2", "--timeout=180"]
    env_file:
      - ./backend/.env
    volumes:
      # Must share the same private storage volume to read uploaded videos
      - private_storage:/var/www/html/storage/app/private
    depends_on:
      - backend
      - postgres
      - pose-worker

  # --- PYTHON POSE WORKER (FASTAPI + MEDIAPIPE) ---
  # Internal service only — not exposed to clients.
  # Reads videos from the shared private_storage volume.
  pose-worker:
    build:
      context: ./pose-worker
      dockerfile: Dockerfile
    container_name: fittrack-pose-worker
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - POSE_VIDEO_MAX_SIZE_MB=100
      - POSE_VIDEO_MAX_DURATION_SEC=60
      # Shared storage mount path (same volume as backend)
      - PRIVATE_STORAGE_PATH=/app/private_storage
    volumes:
      # Pose worker reads videos directly from the shared volume
      - private_storage:/app/private_storage

  # --- DATABASE (POSTGRESQL 16) ---
  # Single source of truth: business data + database queue (jobs table).
  postgres:
    image: postgres:16-alpine
    container_name: fittrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fittrack
      POSTGRES_USER: fittrack_user
      POSTGRES_PASSWORD: fittrack_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  # Named volume for pose video files — shared between backend, queue-worker, and pose-worker.
  # No S3/MinIO required for MVP.
  private_storage:
